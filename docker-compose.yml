services:

  # ── Discord bot ─────────────────────────────────────────────────────────────
  discord-bot:
    build: .
    image: warera-nl:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Dedicated slice of the WarEra API key pool — do not share a keys file
      # with data-fetcher or rijksoverheid-web, or a burst in one container
      # gets every other container rate-limited on the same keys.
      - RW_API_KEYS_PATH=/bot/_api_keys_discord.json
    volumes:
      - ./database:/bot/database   # shared SQLite database
      - ./logs:/bot/logs           # persistent log files
      - ./templates:/bot/templates # mus.json + role/embed templates (live edits via /verwijdermu must persist)
      - ./_api_keys_discord.json:/bot/_api_keys_discord.json:ro
    # --testing makes bot.py read TOKEN_TEST and load testing_config.json,
    # matching the Discord application whose client_id is wired up in .env
    # for the /admin OAuth flow.
    command: ["python", "bot.py", "--testing"]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # allows reaching host ports (e.g. verifier-bot on 8765)

  # NOTE: the hourly all-countries data-fetcher service has been moved to
  # docker-compose.data-fetcher.yml so it can be enabled/disabled
  # independently and is not committed to git (see .gitignore).


