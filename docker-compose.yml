services:

  # ── Discord bot ─────────────────────────────────────────────────────────────
  discord-bot:
    build: .
    image: warera-nl:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./database:/bot/database   # shared SQLite database
      - ./logs:/bot/logs           # persistent log files
    command: ["python", "bot.py"]


